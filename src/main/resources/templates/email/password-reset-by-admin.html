<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Sua senha foi redefinida</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">Um administrador (<strong th:text="${adminName}">Nome</strong>) redefiniu a sua senha às <span th:text="${eventTime}">14:30</span> de <span th:text="${eventDate}">23/10/2026</span>. Use a senha temporária que ele entregou a você: ela vale por 24 horas, e no primeiro acesso você vai definir uma senha nova.</p>
    <p th:replace="~{email/parts :: notYou}"></p>
</div>
</body>
</html>
