<!DOCTYPE html>
<!--
  Moldura de todos os e-mails do CentralDesk (Gmail: tabela, CSS inline, até 600 px, sem JS nem SVG).
  Cada template chama: th:replace="~{email/layout :: layout(~{::title}, ~{::content})}".
-->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title th:replace="${title}">CentralDesk</title>
</head>
<body style="margin:0;padding:0;background-color:#F1F5F9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F1F5F9;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:600px;background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;">
                <tr>
                    <td style="background-color:#002169;border-radius:12px 12px 0 0;padding:20px 28px;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;line-height:1.2;color:#FFFFFF;">
                        CentralDesk
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#1E293B;">
                        <div th:replace="${content}">Conteúdo do e-mail</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px 24px;border-top:1px solid #E2E8F0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#64748B;">
                        E-mail automático do CentralDesk, o sistema de chamados internos da Contabiliza.
                        Não responda a esta mensagem.<br>
                        <a th:href="${appUrl}" href="#" style="color:#0069A8;">Acessar o CentralDesk</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
