<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Sua senha foi alterada</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">A senha da sua conta no CentralDesk foi alterada às <span th:text="${eventTime}">14:30</span> de <span th:text="${eventDate}">23/10/2026</span>. Por segurança, todas as sessões abertas foram encerradas e os navegadores confiáveis foram esquecidos.</p>
    <p th:replace="~{email/parts :: notYou}"></p>
</div>
</body>
</html>
