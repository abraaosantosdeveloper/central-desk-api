<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Uma conta foi bloqueada</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">A conta de <strong th:text="${blockedUserName}">Nome</strong> (<span th:text="${blockedUserEmail}">e-mail</span>) foi bloqueada às <span th:text="${eventTime}">14:30</span> de <span th:text="${eventDate}">23/10/2026</span> depois de 5 tentativas de acesso sem sucesso.</p>
    <p style="margin:0 0 16px;">Confirme a identidade da pessoa antes de redefinir a senha em Usuários. Se ninguém pediu ajuda, pode ser uma tentativa de invasão.</p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 8px;">
        <tr>
            <td style="border-radius:8px;background-color:#002169;">
                <a th:href="${usersUrl}" href="#" style="display:inline-block;padding:12px 22px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:8px;">Abrir Usuários</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
