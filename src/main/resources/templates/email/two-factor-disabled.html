<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Verificação em duas etapas desligada</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">A verificação em duas etapas da sua conta foi desligada às <span th:text="${eventTime}">14:30</span> de <span th:text="${eventDate}">23/10/2026</span>. A partir de agora, o acesso pede só a senha. Você pode religá-la em Meu perfil.</p>
    <p th:replace="~{email/parts :: notYou}"></p>
</div>
</body>
</html>
