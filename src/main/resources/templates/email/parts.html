<!DOCTYPE html>
<!-- Peças reaproveitadas pelos templates. Todas leem as variáveis do próprio e-mail. -->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<p th:fragment="greeting" style="margin:0 0 16px;" th:text="|Olá, ${recipientName}.|">Olá, Maria.</p>

<!-- Resumo do chamado (variáveis comuns: ARQUITETURA-EMAILS §8) -->
<table th:fragment="ticketCard" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:8px 0 20px;background-color:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;">
    <tr>
        <td style="padding:16px 18px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#334155;">
            <div style="font-size:16px;font-weight:bold;color:#002169;">
                <span th:text="|#${ticketNumber}|">#123</span> · <span th:text="${ticketTitle}">Título do chamado</span>
            </div>
            <div>Categoria: <span th:text="${categoryName}">Hardware</span> · Prioridade: <span th:text="${priorityName}">Alta</span></div>
            <div>Solicitante: <span th:text="${requesterName}">João Lima</span> · Setor: <span th:text="${departmentName}">Inovação</span></div>
            <div>Aberto em <span th:text="${openedDate}">23/10/2026</span> às <span th:text="${openedTime}">11:45</span></div>
        </td>
    </tr>
</table>

<table th:fragment="ticketButton" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 8px;">
    <tr>
        <td style="border-radius:8px;background-color:#002169;">
            <a th:href="${ticketUrl}" href="#"
               style="display:inline-block;padding:12px 22px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:8px;">Abrir chamado</a>
        </td>
    </tr>
</table>

<!-- Texto digitado por usuário, linha a linha (sem th:utext) -->
<p th:fragment="lines(items)" style="margin:0;font-size:15px;line-height:1.6;color:#334155;"><th:block th:each="line, it : ${items}"><span th:text="${line}">linha</span><br th:unless="${it.last}"/></th:block></p>

<!-- Código de verificação: grande, fácil de copiar; nunca vai no assunto -->
<div th:fragment="codeBox">
    <p style="margin:8px 0 6px;font-size:15px;color:#334155;">Seu código:</p>
    <p style="margin:0 0 12px;padding:14px 0;text-align:center;background-color:#F1F5F9;border-radius:10px;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:bold;letter-spacing:8px;color:#002169;"
       th:text="${code}">123456</p>
    <p style="margin:0 0 16px;font-size:14px;color:#475569;"
       th:text="|O código vale por ${validityMinutes} minutos e só pode ser usado uma vez. Digite-o na tela do CentralDesk; ninguém da equipe vai pedir este código a você.|">
        O código vale por 10 minutos.</p>
</div>

<p th:fragment="notYou" style="margin:16px 0 0;padding:12px 14px;background-color:#FFF7ED;border-radius:8px;font-size:14px;color:#9A3412;">
    Se não foi você, ignore este e-mail e avise a equipe de Inovação.
</p>

</body>
</html>
