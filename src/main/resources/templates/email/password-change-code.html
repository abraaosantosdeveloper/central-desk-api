<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Código para alterar sua senha</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">Você pediu para alterar a sua senha no seu perfil. Para confirmar, use o código abaixo.</p>
    <div th:replace="~{email/parts :: codeBox}"></div>
    <p th:replace="~{email/parts :: notYou}"></p>
</div>
</body>
</html>
