<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Novo acesso à sua conta</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">A sua conta no CentralDesk foi acessada a partir de um navegador novo (<strong th:text="${browserLabel}">Nome</strong>) às <span th:text="${eventTime}">14:30</span> de <span th:text="${eventDate}">23/10/2026</span>.</p>
    <p th:replace="~{email/parts :: notYou}"></p>
</div>
</body>
</html>
