<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Nova mensagem no chamado</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;"><strong th:text="${authorName}">Nome</strong> (<span th:text="${authorRole}">responsável</span>) escreveu no chamado <strong th:text="|#${ticketNumber}|">#123</strong> às <span th:text="${sentTime}">14:30</span> de <span th:text="${sentDate}">23/10/2026</span>:</p>
    <p style="margin:0 0 6px;font-size:14px;font-weight:bold;color:#002169;">Mensagem</p>
    <div style="margin:0 0 20px;padding:12px 14px;border-left:4px solid #0069A8;background-color:#F8FAFC;">
        <p th:replace="~{email/parts :: lines(${messageLines})}">texto</p>
    </div>
    <p th:if="${messageTruncated}" style="margin:-8px 0 20px;font-size:14px;color:#475569;">A mensagem é longa. Continue lendo no CentralDesk.</p>
    <table th:replace="~{email/parts :: ticketCard}"></table>
    <table th:replace="~{email/parts :: ticketButton}"></table>
</div>
</body>
</html>
