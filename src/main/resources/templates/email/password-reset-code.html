<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Código para redefinir sua senha</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">Recebemos um pedido para redefinir a sua senha. Use o código abaixo na tela "Esqueci minha senha" do CentralDesk.</p>
    <div th:replace="~{email/parts :: codeBox}"></div>
    <p th:replace="~{email/parts :: notYou}"></p>
</div>
</body>
</html>
