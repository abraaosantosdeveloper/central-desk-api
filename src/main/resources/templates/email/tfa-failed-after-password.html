<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Tentativa de acesso à sua conta</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">Alguém digitou a sua senha corretamente às <span th:text="${eventTime}">14:30</span> de <span th:text="${eventDate}">23/10/2026</span>, mas não confirmou o código enviado para este e-mail.</p>
    <p style="margin:0 0 16px;">Se não foi você, a sua senha pode ter vazado: troque-a em Meu perfil e avise a equipe de Inovação.</p>
</div>
</body>
</html>
