<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Chamado Aberto</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;"><strong th:text="${requesterName}">Nome</strong> abriu um chamado para <span th:text="${departmentName}">Inovação</span>. Ele está na fila, esperando alguém assumir.</p>
    <table th:replace="~{email/parts :: ticketCard}"></table>
    <table th:replace="~{email/parts :: ticketButton}"></table>
</div>
</body>
</html>
