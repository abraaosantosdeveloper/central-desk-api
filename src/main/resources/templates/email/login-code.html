<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:replace="~{email/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Seu código de acesso</title>
</head>
<body>
<div th:fragment="content">
    <p th:replace="~{email/parts :: greeting}">Olá.</p>
    <p style="margin:0 0 16px;">Alguém digitou a sua senha corretamente e está entrando no CentralDesk. Para concluir o acesso, use o código abaixo.</p>
    <div th:replace="~{email/parts :: codeBox}"></div>
    <p th:replace="~{email/parts :: notYou}"></p>
</div>
</body>
</html>
